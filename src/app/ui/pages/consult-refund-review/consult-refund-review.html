<div class="container py-4">
  <!-- RESUMEN  -->
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm bg-primary text-white">
        <div class="card-body">
          <h6 class="text-uppercase small fw-bold">Pendientes de Revisión</h6>
          <h3 class="fw-bold mb-0">1</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm bg-warning text-dark">
        <div class="card-body">
          <h6 class="text-uppercase small fw-bold">En Revisión (Under Review)</h6>
          <h3 class="fw-bold mb-0">2</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm bg-dark text-white">
        <div class="card-body">
          <h6 class="text-uppercase small fw-bold">Monto Total Pendiente</h6>
          <h3 class="fw-bold mb-0">$3333</h3>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label small fw-bold text-muted">Buscar (ID / Pedido / Cliente)</label>
            <input
              type="text"
              class="form-control form-control-sm"
              placeholder="Ej. REF-001 o Juan Pérez...">
          </div>
 
          <div class="col-md-3">
            <label class="form-label small fw-bold text-muted">Nivel de Riesgo</label>
            <select class="form-select form-select-sm">
              <option value="ALL">Todos los riesgos</option>
              <option value="LOW">Low</option>
              <option value="MEDIUM">Medium</option>
              <option value="HIGH">High</option>
            </select>
          </div>
 
          <div class="col-md-3">
            <label class="form-label small fw-bold text-muted">Estado</label>
            <select class="form-select form-select-sm">
              <option value="ALL">Todos los estados</option>
              <option value="PENDING">Pending</option>
              <option value="UNDER_REVIEW">Under Review</option>
              <option value="APPROVED">Approved</option>
              <option value="REJECTED">Rejected</option>
              <option value="ESCALATED">Escalated</option>
            </select>
          </div>
 
          <div class="col-md-2">
            <label class="form-label small fw-bold text-muted">Por página</label>
            <select class="form-select form-select-sm">
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="20">20</option>
            </select>
          </div>
        </div>
      </div>
    </div>
 
    <!-- TABLA DE REEMBOLSOS -->
    <div class="card shadow-sm border-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark text-uppercase fs-7">
            <tr>
              <th>ID / Pedido</th>
              <th>Cliente</th>
              <th>Monto</th>
              <th>Riesgo</th>
              <th>Estado</th>
              <th>Fecha Solicitud</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
        </table>
      </div>
 
    </div>
  
</div>
