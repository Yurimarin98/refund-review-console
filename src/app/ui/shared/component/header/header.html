<header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
    <div>
      <h1 class="h3 fw-bold text-dark mb-0">Refund Review Console</h1>
      <p class="text-muted small mb-0">Gestión de solicitudes de reembolso y análisis de riesgo</p>
    </div>
 
    @if (session) {
    <div class="card bg-light border-0 px-3 py-2 shadow-sm">
        <div class="d-flex align-items-center gap-2">
            <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center fw-bold"
                style="width: 35px; height: 35px;">
                {{ session.name.charAt(0).toUpperCase() }}
            </div>
            <div>
                <span class="d-block fw-semibold text-dark small">{{ session.name }}</span>
                <span class="badge bg-secondary" style="font-size: 10px;">Analista</span>
            </div>
        </div>
    </div>
    }
</header>
